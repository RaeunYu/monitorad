name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS 26)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode 버전 확인
        run: xcodebuild -version

      - name: XcodeGen 2.48.0 설치 (프로젝트 드리프트 검사용)
        run: |
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/2.48.0/xcodegen.zip" \
            -o "$RUNNER_TEMP/xcodegen.zip"
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: 프로젝트 드리프트 검사
        run: |
          xcodegen --version
          xcodegen generate
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

      - name: 빌드
        run: |
          xcodebuild \
            -project Monitorad.xcodeproj \
            -scheme Monitorad \
            -destination 'platform=macOS' \
            -derivedDataPath .tools/DerivedData \
            build

      - name: 테스트
        run: |
          xcodebuild \
            -project Monitorad.xcodeproj \
            -scheme Monitorad \
            -destination 'platform=macOS' \
            -derivedDataPath .tools/DerivedData \
            test
