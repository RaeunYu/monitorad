name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 워크플로가 저장소를 읽기만 하도록 최소 권한을 준다.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test (macOS 26)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Xcode 26 전제 확인
        run: |
          xcodebuild -version
          xcodebuild -version | head -1 | grep -q '^Xcode 26\.' || {
            echo "Xcode 26이 필요합니다."
            exit 1
          }

      - name: XcodeGen 2.48.0 설치 (프로젝트 드리프트 검사용)
        env:
          XCODEGEN_SHA256: 620c9f0dc10849f94728ab5df52d225ebab8187439dd6fee1925e59e80dff892
        run: |
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/2.48.0/xcodegen.zip" \
            -o "$RUNNER_TEMP/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/xcodegen/bin" >> "$GITHUB_PATH"

      - name: 프로젝트 드리프트 검사
        run: |
          xcodegen --version
          xcodegen generate
          git diff --exit-code
          test -z "$(git status --porcelain)" || { git status --porcelain; exit 1; }

      - name: 빌드
        run: |
          xcodebuild \
            -project Monitorad.xcodeproj \
            -scheme Monitorad \
            -destination 'platform=macOS' \
            -derivedDataPath .tools/DerivedData \
            build

      - name: 테스트
        run: |
          xcodebuild \
            -project Monitorad.xcodeproj \
            -scheme Monitorad \
            -destination 'platform=macOS' \
            -derivedDataPath .tools/DerivedData \
            test
